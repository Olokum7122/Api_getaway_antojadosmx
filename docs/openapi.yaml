      responses:
        "200": { description: OK }
  /api/v1/antojados/auth/profile/{user_id}:
    get:
      tags: [Auth]
      summary: Obtener perfil
      parameters: [{in: path, name: user_id, required: true, schema: {type: string}}]
      responses:
        "200": { description: OK }
    patch:
      tags: [Auth]
      summary: Actualizar perfil
      parameters: [{in: path, name: user_id, required: true, schema: {type: string}}]
