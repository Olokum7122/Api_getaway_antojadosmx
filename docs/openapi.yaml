openapi: 3.0.3
info:
  title: Antojados API
  version: 1.0.0
  description: API REST de AntojadosMX - Auth, Feed, Places, Posts, Social, Biz, Rewards, Media, Sync, Analytics, Equipo, GT Panel.
servers:
  - url: https://api.antojadosmx.mx
    description: Produccion (Cloudflare HTTPS)
  - url: http://185.187.235.253:8010
    description: Contabo (IP directa - fallback)

tags:
  - name: Health
  - name: Auth
  - name: Feed
  - name: Places
  - name: Posts
  - name: Social
  - name: Biz
  - name: Rewards
  - name: Media
  - name: Sync
  - name: Analytics
  - name: Rating
  - name: Equipo
  - name: Instancias
  - name: GT Tenants
  - name: GT Tiles
  - name: GT Moderation
  - name: GT Notifications
  - name: GT Ops
  - name: GT Dimensions

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200": { description: OK }

  /api/v1/antojados/auth/register:
